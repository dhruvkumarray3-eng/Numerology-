services:
  - type: web
    name: numbott-telethon
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    autoDeploy: false
    healthCheckPath: /health
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_ID
        sync: false
      - key: LOG_CHANNEL_ID
        value: "-1004451890857"
      - key: CHECK_CHANNELS
        value: "@RDXnetworkinghub"
      - key: JOIN_URLS
        value: "https://t.me/RDXnetworkinghub"
      - key: SUPPORT_URL
        value: "https://t.me/usersupportgroupby_vendors"
      - key: OWNER_URL
        value: "https://t.me/Vendor_masterz"
      - key: UPDATES_URL
        value: "https://t.me/vendorsellings"
      - key: MAIN_CHANNEL_URL
        value: "https://t.me/RDXnetworkinghub"
      - key: LZT_API_KEY
        sync: false
      - key: LZT_MARGIN
        value: "25.0"
      - key: PYTHON_VERSION
        value: 3.10.12
